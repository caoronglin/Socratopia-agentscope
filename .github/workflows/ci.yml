name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs on the same branch / pull request instead of wasting
# runners while a series of quick commits is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / doctor and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout (pinned v4)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python (pinned v5)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned test runner
        run: python -m pip install -r requirements-ci.txt
      - name: Verify installed requirements
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: AgentScope architecture doctor (offline)
        run: python scripts/architecture_doctor.py
      - name: Doctor and complete regression suite
        run: python scripts/check.py --strict

  rust-cli:
    name: Rust CLI / fmt, clippy, tests, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install minimal pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Check Rust formatting
        run: cargo +1.99.0 fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check Rust Clippy warnings
        run: cargo +1.99.0 clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run Rust unit tests
        run: cargo +1.99.0 test --manifest-path rust/Cargo.toml --locked
      - name: Compile CLI binary
        run: cargo +1.99.0 build --manifest-path rust/Cargo.toml --release --locked
      - name: Validate read-only CLI entrypoint
        run: |
          rust/target/release/socratopia --version
          rust/target/release/socratopia status --course "遗传学"
          rust/target/release/socratopia preflight
          rust/target/release/socratopia init plan --course "遗传学"

  standalone-bundles:
    name: Standalone ${{ matrix.platform }} / native ZIP smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            cli: rust/target/release/socratopia
          - runner: windows-2022
            platform: windows-x86_64
            cli: rust/target/release/socratopia.exe
          - runner: macos-15-intel
            platform: macos-x86_64
            cli: rust/target/release/socratopia
          - runner: macos-15
            platform: macos-arm64
            cli: rust/target/release/socratopia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned PyInstaller
        shell: bash
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Freeze Python backend
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean --noconfirm \
            --name socratopia-backend \
            --distpath build/standalone --workpath build/pyinstaller \
            --specpath build/pyinstaller --collect-submodules scripts \
            scripts/frozen_backend.py
      - name: Build native Rust CLI
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --manifest-path rust/Cargo.toml --release --locked
      - name: Package ZIP with both executables and smoke-test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CLI_BINARY: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          BACKEND=build/standalone/socratopia-backend
          if [[ "$PLATFORM" == windows-* ]]; then BACKEND="${BACKEND}.exe"; fi
          python scripts/package_release.py \
            --platform "$PLATFORM" --cli-binary "$CLI_BINARY" \
            --backend-binary "$BACKEND" --require-backend --output-dir dist
          PYTHONIOENCODING=utf-8 python scripts/smoke_standalone.py \
            --platform "$PLATFORM" --output-dir dist
