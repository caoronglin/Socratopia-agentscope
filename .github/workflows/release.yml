name: Release Standalone Executables (Rust + frozen CPython)

on:
  push:
    branches: [main]
    paths: ["release/VERSION"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Strict doctor and full Python test suite
        run: python scripts/check.py --strict
      - name: Verify release version, Cargo manifest and lockfile match
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib
          tag = pathlib.Path("release/VERSION").read_text(encoding="utf-8").strip()
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag), "invalid release tag"
          crate = tomllib.loads(pathlib.Path("rust/Cargo.toml").read_text(encoding="utf-8"))
          lock = tomllib.loads(pathlib.Path("rust/Cargo.lock").read_text(encoding="utf-8"))
          version = crate["package"]["version"]
          assert tag == "v" + version, f"mismatched tag {tag} and crate {version}"
          assert any(p["name"] == crate["package"]["name"] and p["version"] == version
                     for p in lock["package"]), "Cargo.lock version differs"
          print("Release version verified:", tag)
          PY
      - name: Rust unit tests before platform packaging
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 test --manifest-path rust/Cargo.toml --locked

  build:
    needs: verify
    name: Package ${{ matrix.platform }} CLI
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            binary: rust/target/release/socratopia
          - runner: windows-2022
            platform: windows-x86_64
            binary: rust/target/release/socratopia.exe
          - runner: macos-15-intel
            platform: macos-x86_64
            binary: rust/target/release/socratopia
          - runner: macos-15
            platform: macos-arm64
            binary: rust/target/release/socratopia
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned standalone builder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Freeze Python backend for this OS and architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --onefile --clean --noconfirm \
            --name socratopia-backend \
            --distpath build/standalone --workpath build/pyinstaller \
            --specpath build/pyinstaller --collect-submodules scripts \
            scripts/frozen_backend.py
      - name: Build native Rust CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --release --locked --manifest-path rust/Cargo.toml
      - name: Package platform ZIP and smoke-test extracted binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CLI_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          BACKEND="build/standalone/socratopia-backend"
          if [[ "$PLATFORM" == windows-* ]]; then BACKEND="${BACKEND}.exe"; fi
          python scripts/package_release.py --platform "$PLATFORM" --cli-binary "$CLI_BINARY" \
            --backend-binary "$BACKEND" --require-backend --output-dir dist
          PYTHONIOENCODING=utf-8 python scripts/smoke_standalone.py \
            --platform "$PLATFORM" --output-dir dist
      - name: Upload platform bundle (ZIP + SHA-256)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download all verified platform bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Verify all eight immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4
          cd dist
          sha256sum --check *.sha256
      - name: Publish verified CLI bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < release/VERSION)"
          test -n "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; refusing to overwrite immutable assets"
            exit 1
          fi
          RELEASE_FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            # Stable releases must be marked as stable and eligible to be latest.
            RELEASE_FLAGS+=(--latest)
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Socratopia PI $TAG (standalone executables)" \
            --notes-file release/NOTES.md \
            "${RELEASE_FLAGS[@]}"
          gh release view "$TAG" --json url,isPrerelease,assets \
            --jq '{url:.url,prerelease:.isPrerelease,assets:[.assets[].name]}'
          if [[ "$TAG" != *-* ]]; then
            test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "false"
            LATEST="$(gh release list --limit 20 --json tagName,isLatest \
              --jq '.[] | select(.isLatest) | .tagName')"
            test "$LATEST" = "$TAG"
          fi
