name: platform-v5

on:
  push:
    branches: [main, feat/v5-platform-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    name: Python 3.15 API and legacy smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - name: Install platform and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Show installed library versions
        run: python -c "import agentscope, sys; print(sys.version); print(agentscope.__version__)"
      - name: Check AgentScope 2.0 import and runtime signatures
        run: |
          python - <<'PY'
          import inspect
          from agentscope.agent import Agent, ReActConfig
          from agentscope.credential import OpenAICredential
          from agentscope.message import UserMsg
          from agentscope.model import OpenAIChatModel
          from agentscope.tool import Toolkit
          assert 'system_prompt' in inspect.signature(Agent).parameters
          assert 'model' in inspect.signature(OpenAIChatModel).parameters
          assert 'credential' in inspect.signature(OpenAIChatModel).parameters
          assert callable(OpenAICredential) and callable(UserMsg)
          assert callable(Toolkit) and 'max_iters' in inspect.signature(ReActConfig).parameters
          PY
      - name: Compile app and existing scripts
        run: python -m compileall -q platform_api scripts tests
      - name: Run API tests
        run: python -m pytest -q tests/test_platform_v5.py tests/test_platform_v5_exercises.py tests/test_platform_v5_flashcards.py tests/test_platform_v5_ontology.py tests/test_platform_v5_chat_history.py tests/test_platform_v5_prep_web.py tests/test_platform_v5_prompt_contract.py tests/test_platform_v5_prep_editor.py tests/test_agentscope_runtime.py tests/test_course_harness.py tests/test_course_tools.py tests/test_snapshot_sync.py tests/test_books_atomic.py
      - name: Run original smoke
        run: python scripts/check.py --strict

  node-web:
    name: React / Ant Design build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install React/Ant Design and build UI
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Diagnose Ant Design 6 with official CLI (offline metadata)
        working-directory: web
        env:
          ANTD_NO_AUTO_REPORT: '1'
          NO_UPDATE_CHECK: '1'
        run: |
          npm run antd:doctor
          ./node_modules/.bin/antd lint ./src --format json > "$RUNNER_TEMP/ant-design-lint.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ant-design-lint.json", "utf8"));
            const problems = [...(report.issues ?? []), ...(report.skippedFiles ?? [])];
            if (report.partial || problems.length) {
              console.error("Ant Design CLI lint gate failed:", JSON.stringify({summary: report.summary, issues: report.issues, skippedFiles: report.skippedFiles}).slice(0, 20000));
              process.exit(1);
            }
            console.log("Ant Design CLI lint: 0 issues, no skipped files");
          '
          npm run antd:usage


  browser-e2e:
    name: Chromium desktop + mobile classroom E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated non-authoritative course data
        run: |
          mkdir -p "$RUNNER_TEMP/socratopia-e2e/templates"
          cp -R templates/. "$RUNNER_TEMP/socratopia-e2e/templates/"
          echo "SOCRATOPIA_ROOT=$RUNNER_TEMP/socratopia-e2e" >> "$GITHUB_ENV"
          echo "SOCRATOPIA_API_TOKEN=e2e-test-token-1234567890" >> "$GITHUB_ENV"
      - name: Install Python FastAPI
        run: python -m pip install -e '.[dev]'
      - name: Install browser test dependencies and Chromium
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile Web workflows
        working-directory: web
        run: npm run test:e2e
