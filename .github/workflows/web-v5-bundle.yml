name: v5 Web Standalone Executables
on:
  push:
    branches: [main, feat/v5-platform-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-v5-bundle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Frozen Web ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: windows-2022
            platform: windows-x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Python 3.15 API and standalone freezer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Build Web UI
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Freeze native Web executable
        shell: bash
        run: python scripts/freeze_web_v5.py
      - name: Package native Web application
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python scripts/package_web_v5.py --platform "$PLATFORM" --output-dir dist
      - name: Smoke test extracted executable and localhost Web
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python scripts/smoke_web_v5.py --archive "dist/Socratopia-v5-Web-alpha-$PLATFORM.zip" --platform "$PLATFORM"
      - name: Upload checked ZIP and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-v5-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  verify-artifacts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: web-v5-*
          path: artifacts
          merge-multiple: true
      - name: Verify all four archives and digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find artifacts -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cd artifacts
          sha256sum --check *.sha256
  quality-gate:
    name: Python regressions and browser confidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - name: Python and architecture validation
        run: |
          python -m compileall -q platform_api scripts tests
          python -m pytest -q tests/test_agentscope_runtime.py tests/test_platform_v5.py tests/test_platform_v5_chat_history.py tests/test_platform_v5_flashcards.py tests/test_platform_v5_ontology.py tests/test_course_harness.py tests/test_course_tools.py tests/test_snapshot_sync.py
          python scripts/check.py --strict
      - name: Browser dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke (desktop and mobile)
        working-directory: web
        env:
          SOCRATOPIA_ROOT: ${{ runner.temp }}/socratopia-v5-browser
          SOCRATOPIA_API_TOKEN: e2e-test-token-1234567890
        run: |
          mkdir -p "$SOCRATOPIA_ROOT/templates"
          cp -R ../templates/. "$SOCRATOPIA_ROOT/templates/"
          npm run build
          npm run test:e2e

  publish-alpha:
    needs: [verify-artifacts, quality-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: web-v5-*
          path: dist
          merge-multiple: true
      - name: Publish prerelease only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check *.sha256)
          TAG="v5.0.0-alpha.web.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Cannot overwrite immutable release"; exit 1
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Socratopia v5 Web Alpha (native executables)" \
            --notes "Alpha preview only: AgentScope-only for classroom and tutor turns, FastAPI for deterministic course authority, React 19 and Ant Design 6 UI. No Pi SDK or bundled Node runtime; no user data or secrets. Four-platform extracted executable smoke checks passed; live external model quality not tested."
