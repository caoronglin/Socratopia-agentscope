[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "socratopia-platform"
version = "5.0.0a8"
description = "Local-first Socratopia teaching platform API"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "agentscope==2.0.11",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
sync = ["boto3>=1.35,<2"]

[tool.hatch.build.targets.wheel]
packages = ["platform_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
